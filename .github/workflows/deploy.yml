name: deploy

# Push to main → tests → build image → push to ECR → EC2 pulls and restarts (via SSM, no SSH).
# AWS auth: the scoped deploy user's access keys from secrets (AWS free plan has no IAM identity
# providers), or a GitHub OIDC role on a paid plan: set vars.AWS_ROLE_ARN AND delete the key
# secrets (with both present the action would try to chain from the keys into the role).
# build-push runs once vars.AWS_REGION exists; deploy once vars.EC2_INSTANCE_ID exists too.
# Logs are public once the repo is: the AWS account id stays masked and no app logs are printed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python -m compileall -q app eval tests scripts
      - run: uv run pytest -q

  build-push:
    needs: test
    if: ${{ vars.AWS_REGION != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # only used when the OIDC role is configured
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    needs: build-push
    if: ${{ vars.EC2_INSTANCE_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # only used when the OIDC role is configured
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr   # resolves the registry URL here instead of passing it (masked) between jobs
        uses: aws-actions/amazon-ecr-login@v2
      - name: Pull and restart on EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ github.sha }}
        run: |
          cat > params.json <<JSON
          {"commands": [
            "set -e",
            "cd /opt/deepdive",
            "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY",
            "export ECR_REGISTRY=$REGISTRY ECR_REPOSITORY=$ECR_REPOSITORY IMAGE_TAG=$TAG",
            "docker compose -f docker-compose.prod.yml pull",
            "docker tag $REGISTRY/$ECR_REPOSITORY:$TAG $REGISTRY/$ECR_REPOSITORY:latest",
            "docker compose -f docker-compose.prod.yml up -d --remove-orphans",
            "docker image prune -f",
            "for i in \$(seq 1 24); do docker compose -f docker-compose.prod.yml ps app | grep -q '(healthy)' && exit 0; sleep 5; done; docker compose -f docker-compose.prod.yml ps; echo 'app not healthy: check logs on the instance (docker compose logs app)'; exit 1"
          ]}
          JSON
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${TAG}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          # Poll (up to ~10 min): pulling the image on a small instance can outlast the built-in waiter.
          STATUS=Pending
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output json
          test "$STATUS" = "Success"
