{% extends "base.html" %}
{% block title %}Access{% endblock %}
{% block content %}
<article class="narrow" style="margin-top: 3rem">
  <h1>Demo access</h1>
  <p>This demo runs real research with paid model calls, so it's protected by an access code.</p>
  <form method="post" action="/access">
    <input type="password" name="code" placeholder="Access code" required autofocus>
    <button type="submit">Enter</button>
  </form>
</article>
{% endblock %}
