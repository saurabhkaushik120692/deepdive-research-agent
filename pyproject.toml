[project]
name = "deepdive-research-agent"
version = "0.1.0"
description = "Self-verifying multi-agent research analyst (Agent Arena 2026 - DeepDive)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "authlib>=1.9.1",
    "chromadb>=1.5.9",
    "fastapi>=0.143.5",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "langgraph>=1.2.16",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.5.0",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
